name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Format check
        run: ruff format --check src tests scripts

      - name: Unit tests
        run: pytest -q

      - name: Verify every actor is deployable
        run: python scripts/check_actors.py

      # The vendored copies of src/govkit are committed, because `apify push`
      # strips anything .gitignore matches. Committed generated code can drift,
      # so prove it hasn't.
      - name: Verify vendored core is in sync
        run: |
          python scripts/build_actor.py
          if ! git diff --exit-code --stat; then
            echo "::error::Vendored core is stale. Run 'python scripts/build_actor.py' and commit the result."
            exit 1
          fi
